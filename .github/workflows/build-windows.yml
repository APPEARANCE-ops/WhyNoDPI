name: Сборка WhyNoDPI для Windows

on:
  workflow_dispatch:
  push:
    paths:
      - "download/WhyNoDPI/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Установить .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Проверить, что проект собирается
        shell: pwsh
        run: |
          dotnet build "download/WhyNoDPI/WhyNoDPI.csproj" -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw "Сборка завершилась ошибкой." }

      - name: Опубликовать одиночный EXE
        shell: pwsh
        run: |
          $publish = Join-Path $env:GITHUB_WORKSPACE "publish"
          dotnet publish "download/WhyNoDPI/WhyNoDPI.csproj" `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:NuGetAudit=false `
            -o $publish
          if ($LASTEXITCODE -ne 0) { throw "Публикация завершилась ошибкой." }

          $exe = Join-Path $publish "WhyNoDPI.exe"
          if (-not (Test-Path $exe)) { throw "EXE не найден в $publish" }

          # Артефакт называем с версией, чтобы не путать сборки.
          $version = (Get-Item $exe).VersionInfo.FileVersion
          Copy-Item $exe (Join-Path $publish "WhyNoDPI-$version-win-x64.exe")

          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          "$hash  WhyNoDPI.exe" | Out-File (Join-Path $publish "SHA256SUMS.txt") -Encoding ascii

          Get-ChildItem $publish -File | Select-Object Name, @{n = "MB"; e = { [math]::Round($_.Length / 1MB, 1) } } | Format-Table -AutoSize

      - name: Загрузить сборку
        uses: actions/upload-artifact@v4
        with:
          name: WhyNoDPI-win-x64
          path: publish/
          if-no-files-found: error
          retention-days: 30

  check-admin-panel:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Проверить, что админ-панель собирается
        run: |
          npm install --no-audit --no-fund
          npx prisma generate --schema prisma/schema.postgres.prisma
          npm run build:vercel
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db?sslmode=require
